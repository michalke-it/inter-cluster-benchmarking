    kubectl exec -i deploy/benchmark-deployment -- python /opt/brokertestingwithlogging.py --payload {{ payloadSize }} \
      -m {{ address_benchmark }}:31883 \
      --warm-up 5 \
      -o {{ results_path.path }}/mosquitto_{{ payloadSize }}_direct_{{ network.name }}.csv
