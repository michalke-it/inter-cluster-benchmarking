apiVersion: v1
kind: Service
metadata:
   name: zenoh-nodeport
   namespace: default
   labels:
      run: zenoh
spec:
   selector:
      run: zenoh
   type: NodePort
   ports:
   - name: zenoh
     port: 7447
     targetPort: 7447
     nodePort: 31447
     protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
   name: zenoh-nodeport-api
   namespace: default
   labels:
      run: zenoh
spec:
   selector:
      run: zenoh
   type: NodePort
   ports:
   - name: zenoh
     port: 8000
     targetPort: 8000
     nodePort: 31800
     protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
   name: zenoh-cluster
   namespace: default
   labels:
      run: zenoh
spec:
   selector:
      run: zenoh
   type: ClusterIP
   ports:
   - name: zenoh-int
     port: 7447
     targetPort: 7447
     protocol: TCP
