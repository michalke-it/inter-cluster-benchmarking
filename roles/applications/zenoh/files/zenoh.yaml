 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: zenoh
   namespace: default
 spec:
   selector:
      matchLabels:
         run: zenoh
   template:
      metadata:
         labels:
            run: zenoh
      spec:
         containers:
         - name: zenoh-broker
           image: docker.io/eclipse/zenoh:1.2.1
           ports:
           - containerPort: 7447
           - containerPort: 8000
           resources:
             limits:
               cpu: 500m
             requests:
               cpu: 200m
