- name: Test zenoh for functionality through submariner
  become: yes
  shell: |
    kubectl exec -i deploy/benchmark-deployment -- nc -zv zenoh-cluster.default.svc.clusterset.local 7447
  retries: 3
  delay: 5
  delegate_to: "{{ current_host }}"
  loop: "{{ groups['headnodes'] }}"
  loop_control:
    loop_var: current_host
  when:
    - "current_host != groups['headnodes'][0]"

- name: Show Submariner config
  become: yes
  shell:
    cmd: "KUBECONFIG=/etc/rancher/k3s/k3s.yaml /tmp/benchfaster/submariner/bin/subctl show all"
  delegate_to: "{{ groups['headnodes'][0] }}"

- name: Test Zenoh through submariner 
  shell: |
    kubectl exec -i deploy/benchmark-deployment -- python /opt/brokertestingwithlogging.py --payload {{ payloadSize }} \
      -z zenoh-cluster.default.svc.clusterset.local:7447 \
      --warm-up 5 \
      -o {{ results_path.path }}/zenoh_{{ payloadSize }}_submariner_{{ network.name }}.csv
  delegate_to: "{{ groups['headnodes'][1] }}"
  loop: "{{ payloadValues }}"
  loop_control:
    loop_var: payloadSize

- name: Test mosquitto through submariner 
  shell: |
    kubectl exec -i deploy/benchmark-deployment -- python /opt/brokertestingwithlogging.py --payload {{ payloadSize }} \
      -m mosquitto-cluster.default.svc.clusterset.local:1883 \
      --warm-up 5 \
      -o {{ results_path.path }}/mosquitto_{{ payloadSize }}_submariner_{{ network.name }}.csv
  delegate_to: "{{ groups['headnodes'][1] }}"
  loop: "{{ payloadValues }}"
  loop_control:
    loop_var: payloadSize

- name: Test RabbitMQ through submariner 
  shell: |
    kubectl exec -i deploy/benchmark-deployment -- python /opt/brokertestingwithlogging.py --payload {{ payloadSize }} \
      -r rabbitmq-cluster.default.svc.clusterset.local:5672 \
      --warm-up 5 \
      -o {{ results_path.path }}/rabbitmq_{{ payloadSize }}_submariner_{{ network.name }}.csv
  delegate_to: "{{ groups['headnodes'][1] }}"
  loop: "{{ payloadValues }}"
  loop_control:
    loop_var: payloadSize
