  shell: |
    kubectl exec -i deploy/benchmark-deployment -- nc -zv rabbitmq-cluster.default.svc.clusterset.local 5672
  retries: 3
  delay: 5
  delegate_to: "{{ current_host }}"
  loop: "{{ groups['headnodes'] }}"
  loop_control:
    loop_var: current_host
  when:
    - "current_host != groups['headnodes'][0]"

- name: Test mosquitto for functionality through submariner
  become: yes
  shell: |
    kubectl exec -i deploy/benchmark-deployment -- nc -zv mosquitto-cluster.default.svc.clusterset.local 1883
  retries: 3
  delay: 5
  delegate_to: "{{ current_host }}"
  loop: "{{ groups['headnodes'] }}"
  loop_control:
    loop_var: current_host
  when:
